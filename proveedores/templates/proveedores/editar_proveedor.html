{% extends 'base.html' %}

{% block title %}Editar Proveedor - ERP Reciclaje{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>✏️ Editar Proveedor</h2>
    <a href="{% url 'lista_proveedores' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}

            <!-- Fila 1: Nombre + NIF -->
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Nombre <span class="text-danger">*</span></label>
                    <input type="text" name="nombre" class="form-control" required value="{{ proveedor.nombre }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">NIF / CIF</label>
                    <input type="text" name="nif" class="form-control" value="{{ proveedor.nif }}">
                </div>
            </div>

            <!-- Fila 2: Tipo + Estado + País -->
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Tipo <span class="text-danger">*</span></label>
                    <select name="tipo" class="form-select" required>
                        {% for codigo, nombre in tipos %}
                        <option value="{{ codigo }}" {% if proveedor.tipo == codigo %}selected{% endif %}>{{ nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        {% for codigo, nombre in estados %}
                        <option value="{{ codigo }}" {% if proveedor.estado == codigo %}selected{% endif %}>{{ nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">País</label>
                    <input type="text" name="pais" class="form-control" value="{{ proveedor.pais }}">
                </div>
            </div>

            <!-- Fila 3: Email + Teléfono -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ proveedor.email }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control" value="{{ proveedor.telefono }}">
                </div>
            </div>

            <!-- Fila 4: Dirección -->
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" name="direccion" class="form-control" value="{{ proveedor.direccion }}">
                </div>
            </div>

            <!-- Fila 5: IBAN -->
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">IBAN</label>
                    <input type="text" name="iban" class="form-control" value="{{ proveedor.iban }}">
                </div>
            </div>

            <!-- Fila 6: NIMA + Gestor -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Código NIMA</label>
                    <input type="text" name="codigo_nima" class="form-control" 
                           value="{{ proveedor.codigo_nima|default:'' }}" 
                           placeholder="Ej: 1234567890">
                    <small class="text-muted">Número de Identificación Medioambiental</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nº Gestor de Residuos</label>
                    <input type="text" name="numero_gestor" class="form-control" 
                           value="{{ proveedor.numero_gestor|default:'' }}"
                           placeholder="Ej: G-12345">
                    <small class="text-muted">Número de gestor autorizado</small>
                </div>
            </div>

            <!-- Fila 7: Notas -->
            <div class="mb-3">
                <label class="form-label">Notas</label>
                <textarea name="notas" class="form-control" rows="3">{{ proveedor.notas }}</textarea>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-check-circle"></i> Guardar cambios
                </button>
                <a href="{% url 'lista_proveedores' %}" class="btn btn-secondary btn-lg">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
