{% extends 'base.html' %}

{% block title %}Nuevo Seguimiento Internacional{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🌍 Nuevo Seguimiento - {{ pedido.numero_pedido }}</h2>
    <a href="{% url 'lista_pedidos' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<form method="POST">
    {% csrf_token %}
    
    <div class="card card-custom mb-4">
        <div class="card-body">
            <h5>📋 Estado y pago</h5>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        {% for key, value in estados %}
                        <option value="{{ key }}">{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Incoterm</label>
                    <select name="incoterm" class="form-select">
                        {% for key, value in incoterms %}
                        <option value="{{ key }}" {% if key == 'CIF' %}selected{% endif %}>{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Condición de pago</label>
                    <select name="condicion_pago" class="form-select">
                        <option value="">-- Seleccionar --</option>
                        {% for c in condiciones %}
                        <option value="{{ c.id }}">{{ c.nombre }} ({{ c.porcentaje_anticipo }}%)</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="card card-custom mb-4">
        <div class="card-body">
            <h5>📦 Datos logísticos</h5>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Nº Contenedor</label>
                    <input type="text" name="numero_contenedor" class="form-control" placeholder="APHU 727480 1">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Nº Precinto</label>
                    <input type="text" name="numero_precinto" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Naviera</label>
                    <input type="text" name="naviera" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Nº BL</label>
                    <input type="text" name="numero_bl" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Buque</label>
                    <input type="text" name="buque" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Puerto origen</label>
                    <input type="text" name="puerto_origen" class="form-control" value="Barcelona">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Puerto destino</label>
                    <input type="text" name="puerto_destino" class="form-control" placeholder="Tema Port - Ghana">
                </div>
            </div>
        </div>
    </div>

    <div class="card card-custom mb-4">
        <div class="card-body">
            <h5>📅 Fechas clave</h5>
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label class="form-label">Fecha carga</label>
                    <input type="date" name="fecha_carga" class="form-control">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Fecha salida</label>
                    <input type="date" name="fecha_salida" class="form-control">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">ETA (llegada estimada)</label>
                    <input type="date" name="fecha_eta" class="form-control">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Entrega real</label>
                    <input type="date" name="fecha_entrega_real" class="form-control">
                </div>
            </div>
        </div>
    </div>

    <div class="card card-custom mb-4">
        <div class="card-body">
            <h5>💰 Datos económicos</h5>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Valor total (€)</label>
                    <input type="number" step="0.01" name="valor_total" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Coste flete (€)</label>
                    <input type="number" step="0.01" name="coste_flete" class="form-control" value="0">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Peso total (kg)</label>
                    <input type="number" step="0.01" name="peso_total_kg" class="form-control" value="0">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Notas</label>
                <textarea name="notas" class="form-control" rows="3"></textarea>
            </div>
        </div>
    </div>

    <div
