{% extends 'base.html' %}

{% block title %}Nueva Cuenta por Cobrar - ERP Reciclaje{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>💰 Nueva Cuenta por Cobrar</h2>
    <a href="{% url 'cuentas_por_cobrar' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Concepto <span class="text-danger">*</span></label>
                    <input type="text" name="concepto" class="form-control" required 
                           placeholder="Ej: Factura 2026044 - JACK HK">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Nº Factura</label>
                    <input type="text" name="numero_factura" class="form-control">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cliente <span class="text-danger">*</span></label>
                    <select name="cliente" class="form-select" required>
                        <option value="">-- Seleccionar --</option>
                        {% for c in clientes %}
                        <option value="{{ c.id }}">{{ c.nombre }} ({{ c.pais }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Importe total (€) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" name="importe_total" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Fecha emisión <span class="text-danger">*</span></label>
                    <input type="date" name="fecha_emision" class="form-control" value="{{ fecha_actual }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Fecha vencimiento <span class="text-danger">*</span></label>
                    <input type="date" name="fecha_vencimiento" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Notas</label>
                <textarea name="notas" class="form-control" rows="3"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success btn-lg">
                    <i class="bi bi-check-circle"></i> Guardar
                </button>
                <a href="{% url 'cuentas_por_cobrar' %}" class="btn btn-secondary btn-lg">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
