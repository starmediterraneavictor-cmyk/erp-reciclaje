{% extends 'base.html' %}

{% block title %}Nueva Deuda - ERP Reciclaje{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>💸 Nueva Cuenta por Pagar</h2>
    <a href="{% url 'cuentas_por_pagar' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="card card-custom">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Concepto <span class="text-danger">*</span></label>
                    <input type="text" name="concepto" class="form-control" required 
                           placeholder="Ej: IVA 3T 2026, Seguridad Social Octubre, Proveedor X...">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Categoría <span class="text-danger">*</span></label>
                    <select name="categoria" class="form-select" required>
                        {% for key, value in categorias %}
                        <option value="{{ key }}">{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Proveedor (opcional)</label>
                    <select name="proveedor" class="form-select">
                        <option value="">-- Sin proveedor --</option>
                        {% for p in proveedores %}
                        <option value="{{ p.id }}">{{ p.nombre }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Proveedor, organismo, entidad...</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Periodicidad</label>
                    <select name="periodicidad" class="form-select">
                        {% for key, value in periodicidades %}
                        <option value="{{ key }}">{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Importe total (€) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" name="importe_total" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Fecha emisión <span class="text-danger">*</span></label>
                    <input type="date" name="fecha_emision" class="form-control" value="{{ fecha_actual }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Fecha vencimiento <span class="text-danger">*</span></label>
                    <input type="date" name="fecha_vencimiento" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nº Factura / Referencia</label>
                    <input type="text" name="numero_factura" class="form-control">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">📎 Factura del proveedor (PDF)</label>
                <input type="file" name="archivo_factura" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
            </div>

            <div class="mb-3">
                <label class="form-label">Notas</label>
                <textarea name="notas" class="form-control" rows="3"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger btn-lg">
                    <i class="bi bi-check-circle"></i> Guardar deuda
                </button>
                <a href="{% url 'cuentas_por_pagar' %}" class="btn btn-secondary btn-lg">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
